<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catroid Туториалы</title>
    <style>
        :root {
            --bg-color: #090d16;
            --card-bg: #131c2e;
            --card-border: rgba(255, 255, 255, 0.07);
            --accent-color: #38bdf8;
            --accent-hover: #0ea5e9;
            --text-color: #f8fafc;
            --text-secondary: #94a3b8;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            padding: 30px 20px;
            min-height: 100vh;
        }

        header {
            text-align: center;
            margin-bottom: 50px;
            padding-top: 10px;
        }

        header h1 {
            font-size: 2.5rem;
            font-weight: 800;
            letter-spacing: -0.5px;
            background: linear-gradient(135deg, #38bdf8, #818cf8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 12px;
        }

        header p {
            color: var(--text-secondary);
            font-size: 1.1rem;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 30px;
        }

        .video-card {
            background-color: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
            transition: transform 0.3s cubic-bezier(04, 0, 0.2, 1), box-shadow 0.3s cubic-bezier(0.4, 0, 0.2, 1), border-color 0.3s;
        }

        .video-card:hover {
            transform: translateY(-6px);
            box-shadow: 0 20px 30px -10px rgba(56, 189, 248, 0.15);
            border-color: rgba(56, 189, 248, 0.3);
        }

        /* Контейнер плеера */
        .custom-video-wrapper {
            position: relative;
            width: 100%;
            aspect-ratio: 16 / 9;
            background: #000;
            overflow: hidden;
        }

        .custom-video-wrapper video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        /* Современная панель управления */
        .video-controls {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background: linear-gradient(to top, rgba(5, 8, 15, 0.9), rgba(5, 8, 15, 0.4), transparent);
            padding: 20px 15px 12px;
            display: flex;
            align-items: center;
            gap: 12px;
            opacity: 0;
            transform: translateY(5px);
            transition: opacity 0.25s ease, transform 0.25s ease;
        }

        .custom-video-wrapper:hover .video-controls {
            opacity: 1;
            transform: translateY(0);
        }

        /* Кнопки управления */
        .ctrl-btn {
            background: none;
            border: none;
            color: #fff;
            cursor: pointer;
            width: 32px;
            height: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 8px;
            transition: background 0.2s, color 0.2s, transform 0.1s;
        }

        .ctrl-btn:hover {
            background: rgba(255, 255, 255, 0.15);
            color: var(--accent-color);
        }

        .ctrl-btn:active {
            transform: scale(0.92);
        }

        .play-btn {
            font-size: 1rem;
        }

        .fullscreen-btn {
            font-size: 1.1rem;
        }

        /* Шкала прогресса */
        .progress-bar-container {
            flex-grow: 1;
            height: 6px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 4px;
            cursor: pointer;
            position: relative;
            overflow: hidden;
            transition: height 0.15s;
        }

        .progress-bar-container:hover {
            height: 8px;
        }

        .progress-filled {
            height: 100%;
            background: var(--accent-color);
            border-radius: 4px;
            width: 0%;
            position: relative;
        }

        /* Таймер */
        .video-time {
            font-size: 0.75rem;
            color: rgba(255, 255, 255, 0.8);
            min-width: 70px;
            text-align: right;
            font-variant-numeric: tabular-nums;
            font-weight: 500;
        }

        /* Информация под видео */
        .video-info {
            padding: 20px;
        }

        .video-title {
            font-size: 1.1rem;
            font-weight: 600;
            margin-bottom: 8px;
            color: var(--text-color);
            line-height: 1.4;
        }

        .video-desc {
            font-size: 0.9rem;
            color: var(--text-secondary);
            line-height: 1.5;
        }

        .loading {
            text-align: center;
            grid-column: 1 / -1;
            color: var(--text-secondary);
            font-size: 1.1rem;
            padding: 50px;
        }
    </style>
</head>
<body>

    <header>
        <h1>Catroid Туториалы</h1>
        <p>Уроки по созданию игр прямо на смартфоне</p>
    </header>

    <main class="container" id="video-grid">
        <div class="loading">Загрузка туториалов...</div>
    </main>

    <script>
        function formatTime(seconds) {
            const minutes = Math.floor(seconds / 60);
            const secs = Math.floor(seconds % 60);
            return `${minutes}:${secs < 10 ? '0' : ''}${secs}`;
        }

        async function loadVideos() {
            const grid = document.getElementById('video-grid');
            try {
                const response = await fetch('videos.json');
                if (!response.ok) throw new Error('Не удалось загрузить список видео');
                
                const videos = await response.json();
                
                if (!videos || videos.length === 0) {
                    grid.innerHTML = '<div class="loading">Скоро здесь появятся новые туториалы!</div>';
                    return;
                }

                grid.innerHTML = '';

                videos.forEach(videoData => {
                    const card = document.createElement('div');
                    card.className = 'video-card';
                    
                    const wrapper = document.createElement('div');
                    wrapper.className = 'custom-video-wrapper';

                    const video = document.createElement('video');
                    video.src = videoData.url;
                    video.preload = "metadata";
                    video.playsInline = true;

                    // Панель управления
                    const controls = document.createElement('div');
                    controls.className = 'video-controls';

                    const playBtn = document.createElement('button');
                    playBtn.className = 'ctrl-btn play-btn';
                    playBtn.innerHTML = '▶';

                    const progressContainer = document.createElement('div');
                    progressContainer.className = 'progress-bar-container';

                    const progressFilled = document.createElement('div');
                    progressFilled.className = 'progress-filled';
                    progressContainer.appendChild(progressFilled);

                    const timeDisplay = document.createElement('div');
                    timeDisplay.className = 'video-time';
                    timeDisplay.textContent = '0:00 / 0:00';

                    const fullscreenBtn = document.createElement('button');
                    fullscreenBtn.className = 'ctrl-btn fullscreen-btn';
                    fullscreenBtn.innerHTML = '⛶';

                    controls.appendChild(playBtn);
                    controls.appendChild(progressContainer);
                    controls.appendChild(timeDisplay);
                    controls.appendChild(fullscreenBtn);

                    wrapper.appendChild(video);
                    wrapper.appendChild(controls);

                    // Логика плеера
                    playBtn.addEventListener('click', (e) => {
                        e.stopPropagation();
                        if (video.paused) {
                            video.play();
                            playBtn.innerHTML = '⏸';
                        } else {
                            video.pause();
                            playBtn.innerHTML = '▶';
                        }
                    });

                    video.addEventListener('click', () => {
                        playBtn.click();
                    });

                    video.addEventListener('timeupdate', () => {
                        const percent = (video.currentTime / video.duration) * 100;
                        progressFilled.style.width = `${percent}%`;
                        timeDisplay.textContent = `${formatTime(video.currentTime)} / ${formatTime(video.duration || 0)}`;
                    });

                    progressContainer.addEventListener('click', (e) => {
                        const rect = progressContainer.getBoundingClientRect();
                        const pos = (e.clientX - rect.left) / rect.width;
                        video.currentTime = pos * video.duration;
                    });

                    video.addEventListener('ended', () => {
                        playBtn.innerHTML = '▶';
                    });

                    // Полноэкранный режим
                    fullscreenBtn.addEventListener('click', (e) => {
                        e.stopPropagation();
                        if (wrapper.requestFullscreen) {
                            wrapper.requestFullscreen();
                        } else if (wrapper.webkitRequestFullscreen) {
                            wrapper.webkitRequestFullscreen();
                        } else if (video.webkitEnterFullscreen) {
                            video.webkitEnterFullscreen(); // Для iOS
                        }
                    });

                    // Информация под видео (без папки)
                    const videoInfo = document.createElement('div');
                    videoInfo.className = 'video-info';

                    const titleDiv = document.createElement('div');
                    titleDiv.className = 'video-title';
                    titleDiv.textContent = videoData.title;

                    const descDiv = document.createElement('div');
                    descDiv.className = 'video-desc';
                    descDiv.textContent = videoData.description || '';

                    videoInfo.appendChild(titleDiv);
                    videoInfo.appendChild(descDiv);

                    card.appendChild(wrapper);
                    card.appendChild(videoInfo);
                    grid.appendChild(card);
                });

            } catch (error) {
                console.error(error);
                grid.innerHTML = '<div class="loading">Ошибка загрузки видео. Проверьте файл videos.json</div>';
            }
        }

        loadVideos();
    </script>

</body>
</html>
