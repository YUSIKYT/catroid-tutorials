<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Туториалы по Catroid</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --accent-color: #38bdf8;
            --text-color: #f8fafc;
            --text-secondary: #94a3b8;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            padding: 20px;
        }

        header {
            text-align: center;
            margin-bottom: 40px;
            padding-top: 20px;
        }

        header h1 {
            font-size: 2.3rem;
            color: var(--accent-color);
            margin-bottom: 10px;
        }

        header p {
            color: var(--text-secondary);
            font-size: 1.05rem;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 25px;
        }

        .video-card {
            background-color: var(--card-bg);
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .video-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 10px 15px rgba(56, 189, 248, 0.15);
        }

        /* Кастомный контейнер плеера */
        .custom-video-wrapper {
            position: relative;
            width: 100%;
            aspect-ratio: 16 / 9;
            background: #000;
            overflow: hidden;
        }

        .custom-video-wrapper video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        /* Панель управления */
        .video-controls {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background: linear-gradient(transparent, rgba(0, 0, 0, 0.8));
            padding: 15px 10px 10px;
            display: flex;
            align-items: center;
            gap: 10px;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .custom-video-wrapper:hover .video-controls {
            opacity: 1;
        }

        /* Кнопка Play/Pause */
        .play-btn {
            background: none;
            border: none;
            color: #fff;
            font-size: 1.2rem;
            cursor: pointer;
            width: 30px;
            height: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.1s;
        }

        .play-btn:hover {
            transform: scale(1.1);
            color: var(--accent-color);
        }

        /* Шкала прогресса */
        .progress-bar-container {
            flex-grow: 1;
            height: 6px;
            background: rgba(255, 255, 255, 0.3);
            border-radius: 3px;
            cursor: pointer;
            position: relative;
        }

        .progress-filled {
            height: 100%;
            background: var(--accent-color);
            border-radius: 3px;
            width: 0%;
        }

        /* Таймер */
        .video-time {
            font-size: 0.8rem;
            color: #fff;
            min-width: 75px;
            text-align: right;
            font-variant-numeric: tabular-nums;
        }

        .video-info {
            padding: 15px;
        }

        .video-title {
            font-size: 1.05rem;
            font-weight: 600;
            margin-bottom: 8px;
            color: var(--text-color);
        }

        .video-desc {
            font-size: 0.9rem;
            color: var(--text-secondary);
            line-height: 1.4;
            margin-bottom: 10px;
        }

        .video-folder-badge {
            display: inline-block;
            background-color: rgba(56, 189, 248, 0.1);
            color: var(--accent-color);
            font-size: 0.75rem;
            padding: 3px 8px;
            border-radius: 6px;
            font-family: monospace;
        }

        .loading {
            text-align: center;
            grid-column: 1 / -1;
            color: var(--text-secondary);
            font-size: 1.1rem;
            padding: 40px;
        }
    </style>
</head>
<body>

    <header>
        <h1>Catroid Туториалы</h1>
        <p>Уроки по созданию игр прямо на смартфоне</p>
    </header>

    <main class="container" id="video-grid">
        <div class="loading">Загрузка туториалов...</div>
    </main>

    <script>
        function formatTime(seconds) {
            const minutes = Math.floor(seconds / 60);
            const secs = Math.floor(seconds % 60);
            return `${minutes}:${secs < 10 ? '0' : ''}${secs}`;
        }

        async function loadVideos() {
            const grid = document.getElementById('video-grid');
            try {
                const response = await fetch('videos.json');
                if (!response.ok) throw new Error('Не удалось загрузить список видео');
                
                const videos = await response.json();
                
                if (!videos || videos.length === 0) {
                    grid.innerHTML = '<div class="loading">Скоро здесь появятся новые туториалы!</div>';
                    return;
                }

                grid.innerHTML = '';

                videos.forEach(videoData => {
                    const card = document.createElement('div');
                    card.className = 'video-card';
                    
                    const wrapper = document.createElement('div');
                    wrapper.className = 'custom-video-wrapper';

                    const video = document.createElement('video');
                    video.src = videoData.url;
                    video.preload = "metadata";
                    video.playsInline = true;

                    // Создаем свою панель управления
                    const controls = document.createElement('div');
                    controls.className = 'video-controls';

                    const playBtn = document.createElement('button');
                    playBtn.className = 'play-btn';
                    playBtn.innerHTML = '▶';

                    const progressContainer = document.createElement('div');
                    progressContainer.className = 'progress-bar-container';

                    const progressFilled = document.createElement('div');
                    progressFilled.className = 'progress-filled';
                    progressContainer.appendChild(progressFilled);

                    const timeDisplay = document.createElement('div');
                    timeDisplay.className = 'video-time';
                    timeDisplay.textContent = '0:00 / 0:00';

                    controls.appendChild(playBtn);
                    controls.appendChild(progressContainer);
                    controls.appendChild(timeDisplay);

                    wrapper.appendChild(video);
                    wrapper.appendChild(controls);

                    // Логика плеера
                    playBtn.addEventListener('click', () => {
                        if (video.paused) {
                            video.play();
                            playBtn.innerHTML = '⏸';
                        } else {
                            video.pause();
                            playBtn.innerHTML = '▶';
                        }
                    });

                    video.addEventListener('click', () => {
                        playBtn.click();
                    });

                    video.addEventListener('timeupdate', () => {
                        const percent = (video.currentTime / video.duration) * 100;
                        progressFilled.style.width = `${percent}%`;
                        timeDisplay.textContent = `${formatTime(video.currentTime)} / ${formatTime(video.duration || 0)}`;
                    });

                    progressContainer.addEventListener('click', (e) => {
                        const rect = progressContainer.getBoundingClientRect();
                        const pos = (e.clientX - rect.left) / rect.width;
                        video.currentTime = pos * video.duration;
                    });

                    video.addEventListener('ended', () => {
                        playBtn.innerHTML = '▶';
                    });

                    // Информация под видео
                    const videoInfo = document.createElement('div');
                    videoInfo.className = 'video-info';

                    const titleDiv = document.createElement('div');
                    titleDiv.className = 'video-title';
                    titleDiv.textContent = videoData.title;

                    const descDiv = document.createElement('div');
                    descDiv.className = 'video-desc';
                    descDiv.textContent = videoData.description || '';

                    const folderBadge = document.createElement('div');
                    folderBadge.className = 'video-folder-badge';
                    folderBadge.textContent = "📁 Источник: " + videoData.url;

                    videoInfo.appendChild(titleDiv);
                    videoInfo.appendChild(descDiv);
                    videoInfo.appendChild(folderBadge);

                    card.appendChild(wrapper);
                    card.appendChild(videoInfo);
                    grid.appendChild(card);
                });

            } catch (error) {
                console.error(error);
                grid.innerHTML = '<div class="loading">Ошибка загрузки видео. Проверьте файл videos.json</div>';
            }
        }

        loadVideos();
    </script>

</body>
</html>
